name: CriticAI Code Review
description: AI-assisted GitHub PR code review powered by AWS Bedrock. Inline fixes, auto-approval, codebase-aware analysis, zero per-seat cost.
inputs:
  # AWS
  aws-access-key-id:
    description: 'AWS Access Key ID'
    required: true
  aws-secret-access-key:
    description: 'AWS Secret Access Key'
    required: true
  aws-region:
    description: 'AWS Region'
    required: true
  # GitHub
  github-token:
    description: 'GitHub Token'
    required: true
  # Bedrock
  model:
    description: >
      Primary Bedrock model ID or inference profile ID. Accepts Anthropic
      (e.g. "anthropic.claude-opus-4-8"), Amazon Titan,
      or OpenAI (e.g. "openai.gpt-5.6-sol") model IDs. OpenAI models are
      called through the separate bedrock-mantle endpoint automatically —
      see NOTICE.md.
    required: false
    default: 'openai.gpt-5.6-sol'
  fallback-model:
    description: >
      Model ID to retry with if the primary `model` call fails for any
      reason (auth, throttling, model unavailable, or an empty/incomplete
      response). Leave empty to disable fallback. Can mix providers, e.g.
      an OpenAI primary with an Anthropic fallback.
    required: false
    default: 'us.anthropic.claude-3-5-haiku-20241022-v1:0'
  max-tokens:
    description: >
      Max output tokens. For Anthropic, 3072 is Bedrock's ceiling for this
      action's request shape. For OpenAI models, this maps to
      max_output_tokens and also covers the model's internal reasoning
      tokens — too low a value can make the model spend its whole budget
      reasoning and return no visible text (see NOTICE.md).
    required: false
    default: 8192
  # Custom
  prompt:
    description: >
      Bedrock prompt. The default produces a structured review with
      Summary, Walkthrough, severity-tagged Findings, and inline JSON
      for suggestion blocks. Overriding this input replaces the structure
      entirely, not just the persona/focus.
    required: false
    default: >-
      You are an expert code reviewer performing a pull request review.
      Below is a code diff. Your response MUST have exactly two parts:


      PART 1: A markdown review using this structure (no preamble before
      the first heading):


      ## Summary

      1-3 sentences on what this PR does and its overall impact.


      ## Walkthrough

      A short bullet list of the key changes, grouped by file or
      concern. Skip trivial/mechanical changes (formatting, renames with
      no logic change).


      ## Findings

      A numbered list of concrete issues, if any. Omit this whole
      section if there are none. For each finding:

      - Start the line with a severity tag: 🔴 Critical, 🟠 Major, 🟡
      Minor, or 🔵 Nit — followed by a short category in italics, e.g.
      *Security*, *Performance*, *Correctness*, *Reliability*, *Style*.

      - Name the specific file and, if useful, line or function.

      - Explain the issue concisely and why it matters.

      - If there's a concrete fix, show it in a fenced code block. Keep
      suggested code minimal and directly applicable — do not
      paste large unrelated chunks of the file.


      ## Suggested follow-ups

      Optional: non-blocking nits or ideas that don't rise to a Finding.
      Bullet list, or omit the section entirely if there's nothing worth
      mentioning.


      PART 2: After the markdown, output a fenced JSON block containing
      an array of structured findings for inline comments. This MUST be
      the last thing in your response. Use this exact format:


      ```json

      [
        {
          "path": "src/example.ts",
          "line": 42,
          "severity": "🟠 Major",
          "category": "Correctness",
          "message": "Brief explanation of the issue.",
          "suggestion": "corrected code for this line (optional, omit key if no fix)",
          "confidence": "high"
        }
      ]

      ```


      Rules for the JSON block:

      - "path" must be the exact file path from the diff (e.g.
      "src/lib/constants.ts", not just "constants.ts")

      - "line" must be the line number in the NEW version of the file
      (the + side of the diff)

      - "suggestion" should contain ONLY the replacement code for that
      single line (what should replace the current line). Omit the
      "suggestion" key entirely if you have no concrete fix.

      - "confidence" must be "high", "medium", or "low". Use "high" for
      definite bugs and clear violations. Use "medium" for likely issues
      that depend on context. Use "low" for stylistic nits and
      observations that might be intentional.

      - Include an entry for every finding from Part 1 that maps to a
      specific line. Omit findings that are general/architectural and
      don't map to a single line.

      - If there are no findings, output an empty array: []


      Be direct and specific rather than generic. Do not restate the
      whole diff. Do not praise the code unless a specific choice
      meaningfully avoids a real pitfall worth calling out. If the diff
      is empty or trivial (e.g. only comments, formatting, or generated
      files), say so briefly instead of inventing findings.
  language:
    description: 'Response Language'
    required: false
    default: 'English'
  title:
    description: 'Title shown on the posted PR comment (a robot emoji and attribution footer are added automatically — see README.md "Comment format")'
    required: false
    default: 'Code Review'
  temperature:
    description: 'Model Temperature'
    required: false
    default: 0.5
  top-p:
    description: 'Model Top P (ignored for Anthropic models — see NOTICE.md)'
    required: false
    default: 0.9
  home-directory:
    description: 'Home Directory In Your Project'
    required: false
    default: ''
  linters:
    description: >
      Static analysis tools to run alongside the AI review. 'auto'
      (default) auto-detects available linters in PATH and runs them on
      matching changed files. 'none' disables linting. Or provide a
      comma-separated list: 'ruff,eslint,shellcheck,golangci-lint,rubocop,clippy'.
    required: false
    default: 'auto'
  mode:
    description: 'Execution mode: "review" (default) runs the PR review, "commands" handles @criticai comment replies'
    required: false
    default: 'review'

branding:
  icon: 'check-circle'
  color: white

runs:
  using: 'composite'
  steps:
    - run: pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash
    - run: |
        if [ "${{ inputs.mode }}" = "commands" ]; then
          python ${{ github.action_path }}/comment_handler.py
        else
          python ${{ github.action_path }}/main.py
        fi
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        INPUT_AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        INPUT_AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        INPUT_AWS_REGION: ${{ inputs.aws-region }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_GITHUB_REPOSITORY: ${{ github.repository }}
        INPUT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_FALLBACK_MODEL: ${{ inputs.fallback-model }}
        INPUT_MAX_TOKENS: ${{ inputs.max-tokens }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_TEMPERATURE: ${{ inputs.temperature }}
        INPUT_TOP_P: ${{ inputs.top-p }}
        INPUT_HOME_DIRECTORY: ${{ inputs.home-directory }}
        INPUT_LINTERS: ${{ inputs.linters }}
